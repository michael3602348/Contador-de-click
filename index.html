<!DOCTYPE html>
<html lang="es">

<head>
    <!-- ?Meta datos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ?Titulo de la pagina -->
    <title>Contador de clicks</title>
    <!-- ?Links: Recursos externos -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <!-- ?Contenido principal de la pagina -->
    <main id="contenedor">
        <!-- ?Contenedor del contador -->
        <div class="div-contador">
            <!-- ?contenedor -->
            <div class="contador">
                <!-- ?contendor de los numeros -->
                <div class="div-numeros">
                    <h2 class="numeros" id="numeros"></h2>
                </div>
                <!-- ?contendor de los botones de suma, restar y resetear -->
                <div class="div-surest">
                    <!-- ?Botones de suma y restar -->
                    <div class="div_divs-surest">
                        <div class="div-resta"><button class="resta" id="restar">Restar</button></div>
                        <div class="div-suma"><button class="suma" id="sumar">Sumar</button></div>
                    </div>
                    <!-- ?Boton para resetear -->
                    <div class="div_div-resetear">
                        <div class="div-resetear"><button class="resetear" id="resetear">Resetear</button></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- ?archivos de javascript -->
    <script src="scripts/script.js"></script>
</body>

</html>
